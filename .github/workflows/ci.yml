name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: examples run
        if: runner.os == 'Linux'
        run: |
          for dir in src/examples/*/; do
            if grep -q 'long-running' "$dir/moon.pkg"; then
              continue
            fi
            if grep -q 'is-main' "$dir/moon.pkg"; then
              moon run "$dir" --target native > /dev/null
            fi
          done

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

      - name: the skills are valid
        if: runner.os == 'Linux'
        run: |
          for dir in docs/skills/*/; do
            case "$dir" in *CHANGE-ME*) continue ;; esac
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

      # A reader pastes the blocks of the README and the skills into a project, so they have
      # to compile as written, against this commit's source.
      - name: the code in the docs compiles
        if: runner.os == 'Linux'
        run: python3 scripts/check_snippets.py

      - name: openapi field table is up to date
        if: runner.os == 'Linux'
        run: python3 scripts/openapi/gen_fields.py --check

  live:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: registry index
        run: |
          moon version --all
          moon update

      - name: install ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: model server and live tests
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:11434/api/version > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:11434/api/version
          ollama pull qwen2.5:0.5b
          ollama pull nomic-embed-text
          export MOONMUSE_LIVE=1
          export OLLAMA_MODEL=qwen2.5:0.5b
          export OLLAMA_EMBED_MODEL=nomic-embed-text
          moon test --target native

  # The telemetry this library emits, judged by the semantic conventions project's own tool:
  # a span goes over OTLP to a live checker, which matches every attribute against the GenAI
  # registry. A name that is misspelled, unknown or retired fails here.
  semantic-conventions:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: registry index
        run: |
          moon version --all
          moon update

      - name: run the live check
        run: bash scripts/otel-live-check.sh

  interop:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: registry index
        run: |
          moon version --all
          moon update

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: official client libraries
        run: pip install openai anthropic ollama google-genai

      - name: run the gateway against the official clients
        run: bash scripts/interop/run.sh
